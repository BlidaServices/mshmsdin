<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}
#yt{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="yt" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
<script>
var params = new URLSearchParams(location.search);
var videoId = params.get('v') || '';
var startSec = parseInt(params.get('start') || '0', 10) || 0;
var playerOrigin = params.get('origin') || location.origin;
var iframe = document.getElementById('yt');
var base = 'https://www.youtube.com/embed/' + encodeURIComponent(videoId);
iframe.src = base + '?start=' + startSec + '&autoplay=0&controls=1&autohide=0&playsinline=1&rel=0&enablejsapi=1&fs=1&origin=' + encodeURIComponent(playerOrigin) + '&widget_referrer=' + encodeURIComponent(playerOrigin);
window.seekTo = function(sec) {
  iframe.contentWindow.postMessage(JSON.stringify({event:'command', func:'seekTo', args:[sec, true]}), '*');
};
window.addEventListener('message', function(e) {
  try {
    var d = JSON.parse(e.data);
    if (d.event === 'error' && window.AndroidError) window.AndroidError.onError(d.data);
  } catch (_) {}
});
</script>
</body>
</html>
